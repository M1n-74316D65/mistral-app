<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      width: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @media (prefers-color-scheme: dark) {
      html:not(.light), html:not(.light) body { background: #1c1c1e; color: #f5f5f7; }
    }
    html.dark, html.dark body { background: #1c1c1e; color: #f5f5f7; }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 28px;
      padding: 40px;
      text-align: center;
    }
    .logo {
      width: 88px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(255, 107, 53, 0.2));
    }
    @media (prefers-color-scheme: dark) {
      html:not(.light) .logo {
        filter: drop-shadow(0 4px 16px rgba(255, 107, 53, 0.3));
      }
    }
    html.dark .logo {
      filter: drop-shadow(0 4px 16px rgba(255, 107, 53, 0.3));
    }
    
    /* Loading state */
    .container.loading .logo {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .container.loading .status-text { 
      display: block; 
      animation: fadeIn 0.5s ease-out;
    }
    .container.loading .offline-content { display: none; }
    
    /* Offline state */
    .container.offline .logo {
      animation: none;
      opacity: 0.6;
      filter: grayscale(0.8) opacity(0.8);
    }
    .container.offline .status-text { display: none; }
    .container.offline .offline-content { 
      display: flex; 
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .status-text {
      color: #71717a;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      html:not(.light) .status-text { color: #8e8e93; }
    }
    html.dark .status-text { color: #8e8e93; }
    
    .offline-content {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .offline-title {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }
    .offline-message {
      font-size: 15px;
      color: #71717a;
      max-width: 320px;
      line-height: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      html:not(.light) .offline-title { color: #f5f5f7; }
      html:not(.light) .offline-message { color: #8e8e93; }
    }
    html.dark .offline-title { color: #f5f5f7; }
    html.dark .offline-message { color: #8e8e93; }
    
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
      margin-top: 16px;
    }
    .retry-btn:hover {
      background: linear-gradient(135deg, #ff5722 0%, #ff8c00 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
    }
    .retry-btn:active {
      transform: translateY(0) scale(0.96);
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
    }
    .retry-btn:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }
    .retry-btn svg {
      width: 18px;
      height: 18px;
    }
    .retry-btn.retrying svg {
      animation: spin 1s linear infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.98); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container loading" id="main-container">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212.121 151.515">
      <rect fill="#FCD34D" x="30.303" y="0" width="30.303" height="30.303"/>
      <rect fill="#FCD34D" x="151.515" y="0" width="30.303" height="30.303"/>
      <rect fill="#FBBF24" x="30.303" y="30.303" width="60.606" height="30.303"/>
      <rect fill="#FBBF24" x="121.212" y="30.303" width="60.606" height="30.303"/>
      <rect fill="#FB923C" x="30.303" y="60.606" width="151.515" height="30.303"/>
      <rect fill="#F97316" x="30.303" y="90.909" width="30.303" height="30.303"/>
      <rect fill="#F97316" x="90.909" y="90.909" width="30.303" height="30.303"/>
      <rect fill="#F97316" x="151.515" y="90.909" width="30.303" height="30.303"/>
      <rect fill="#B91C1C" x="0" y="121.212" width="90.909" height="30.303"/>
      <rect fill="#B91C1C" x="121.212" y="121.212" width="90.909" height="30.303"/>
    </svg>
    <p class="status-text">Loading Le Chat...</p>
    <div class="offline-content">
      <h2 class="offline-title">Unable to connect</h2>
      <p class="offline-message">
        Could not reach chat.mistral.ai. Check your internet connection and try again.
      </p>
      <button class="retry-btn" id="retry-btn" onclick="retryConnection()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 21h5v-5"/>
        </svg>
        Retry
      </button>
    </div>
  </div>
  <script>
    const CHAT_URL = 'https://chat.mistral.ai/chat';
    
    // Apply theme from settings
    if (window.__TAURI__) {
      window.__TAURI__.core.invoke('get_settings').then(settings => {
        if (settings && settings.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (settings && settings.theme === 'light') {
          document.documentElement.classList.add('light');
        }
      }).catch(e => console.error('Failed to load theme:', e));
      
      // Listen for theme changes
      window.__TAURI__.event.listen('theme-changed', (event) => {
        const { theme } = event.payload || {};
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      });
    }

    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      const container = document.getElementById('main-container');
      
      btn.disabled = true;
      btn.classList.add('retrying');
      container.className = 'container loading';
      
      // Try navigating to the chat URL
      if (window.__TAURI__) {
        window.__TAURI__.core.invoke('navigate_to_chat').catch(() => {
          // If the command fails, try direct navigation
          window.location.href = CHAT_URL;
        });
      } else {
        window.location.href = CHAT_URL;
      }
      
      // Reset button after a delay in case navigation doesn't work
      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('retrying');
        container.className = 'container offline';
      }, 5000);
    }
    
    // Auto-retry on coming back online
    window.addEventListener('online', () => {
      retryConnection();
    });
  </script>
</body>
</html>
